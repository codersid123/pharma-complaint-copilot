services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: complaint_copilot
    volumes:
      - pgdata:/var/lib/postgresql/data # data survives `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d complaint_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports:" on purpose: only the backend talks to this database, and
    # your own Postgres on 5432 keeps working without a clash.

  backend:
    build: ./backend
    environment:
      # "db" is the service name above; Docker's network resolves it.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/complaint_copilot
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GROQ_FALLBACK_MODEL: ${GROQ_FALLBACK_MODEL:-openai/gpt-oss-20b}
      GROQ_REASONING_MODEL: ${GROQ_REASONING_MODEL:-openai/gpt-oss-120b}
    depends_on:
      db:
        condition: service_healthy # wait until Postgres accepts connections
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80" # same URL as `npm run dev`, so CORS settings still match

volumes:
  pgdata:
